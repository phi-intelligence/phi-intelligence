services:
  postgres:
    image: postgres:15-alpine
    container_name: phi-tms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: phi_tms_user
      POSTGRES_PASSWORD: phi_tms_password_2024
      POSTGRES_DB: phi_tms_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - phi-tms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phi_tms_user -d phi_tms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phi-tms-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://phi_tms_user:phi_tms_password_2024@postgres:5432/phi_tms_db
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 24h
      ENCRYPTION_KEY: your-32-char-encryption-key-here
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    networks:
      - phi-tms-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 5000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phi-tms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - phi-tms-network
    command: npm run dev

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  phi-tms-network:
    driver: bridge

